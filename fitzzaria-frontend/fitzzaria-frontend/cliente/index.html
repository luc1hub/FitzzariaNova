<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitzzaria — Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top-bar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="boas-vindas.html" class="back-link">←</a>
    <span class="wordmark">Fitz<em>zaria</em></span>
    <a href="carrinho.html" class="icon-link">🛒<span class="cart-count" id="cart-count" style="position:absolute; margin-left:-8px; margin-top:-8px;">0</span></a>
  </div>
</header>

<main class="container py-4">
  <h1 class="h4 mb-4">Nosso Cardápio</h1>

  <div class="row g-4">
    <div class="col-md-3">
      <div class="filtros-sidebar">
        <h3>Categorias</h3>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filtro-todas" checked onchange="alternarFiltroTodas()">
          <label class="form-check-label" for="filtro-todas">Todas</label>
        </div>
        <div class="form-check">
          <input class="form-check-input filtro-categoria" type="checkbox" value="Fit" id="filtro-fit" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-fit">Fit</label>
        </div>
        <div class="form-check">
          <input class="form-check-input filtro-categoria" type="checkbox" value="Vegana" id="filtro-vegana" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-vegana">Vegana</label>
        </div>
        <div class="form-check">
          <input class="form-check-input filtro-categoria" type="checkbox" value="Low Carb" id="filtro-lowcarb" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-lowcarb">Low Carb</label>
        </div>

        <h3 class="mt-4">Preço</h3>
        <div class="form-check">
          <input class="form-check-input filtro-preco" type="checkbox" value="ate45" id="filtro-ate45" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-ate45">Até R$ 45</label>
        </div>
        <div class="form-check">
          <input class="form-check-input filtro-preco" type="checkbox" value="45a50" id="filtro-45a50" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-45a50">R$ 45 a R$ 50</label>
        </div>
        <div class="form-check">
          <input class="form-check-input filtro-preco" type="checkbox" value="acima50" id="filtro-acima50" onchange="aplicarFiltros()">
          <label class="form-check-label" for="filtro-acima50">Acima de R$ 50</label>
        </div>
      </div>
    </div>

    <div class="col-md-9">
      <div class="produtos-grid" id="cardapio-container"></div>
    </div>
  </div>
</main>

<div class="bottom-nav-spacer"></div>
<nav class="bottom-nav">
  <a href="index.html" class="active"><span class="icon">🏠</span>Cardápio</a>
  <a href="carrinho.html"><span class="icon">🛒</span>Carrinho</a>
  <a href="acompanhamento.html"><span class="icon">📦</span>Acompanhar</a>
</nav>

<div class="modal fade" id="produtoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content fitz">
      <div class="modal-header">
        <h3 class="modal-title" id="produtoModalNome">Produto</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <img id="produtoModalFoto" src="" alt="" class="w-100 mb-3" style="border-radius: var(--radius-m); max-height: 220px; object-fit: cover;">
        <p id="produtoModalDescricao" class="text-muted"></p>

        <div id="produtoModalOpcoes"></div>

        <p class="fw-semibold mb-2 mt-3">Tamanho</p>
        <div id="produtoModalTamanho" class="d-flex gap-4 mb-2"></div>

        <div class="d-flex align-items-center justify-content-between mt-3">
          <span class="fw-semibold">Quantidade</span>
          <div class="qty-stepper">
            <button type="button" onclick="diminuirQuantidadeModal()">−</button>
            <span id="qtyValor">1</span>
            <button type="button" onclick="aumentarQuantidadeModal()">+</button>
          </div>
        </div>
      </div>
      <div class="modal-footer d-flex align-items-center justify-content-between">
        <span class="display fw-semibold" id="produtoModalPrecoTotal">R$ 0,00</span>
        <button type="button" class="btn-fitz" id="btnAdicionarCarrinho" disabled onclick="confirmarAdicionarAoCarrinho()">Adicionar ao carrinho</button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
  <div id="toastAdicionado" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">Item adicionado ao carrinho.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/cardapio.js"></script>
</body>
</html>
