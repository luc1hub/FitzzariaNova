<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitzzaria — Meu Carrinho</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top-bar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="back-link">←</a>
    <span class="wordmark">Fitz<em>zaria</em></span>
    <span style="width: 28px"></span>
  </div>
</header>

<main class="container py-4">
  <h1 class="h4 mb-4">Meu Carrinho</h1>

  <div class="row g-4">
    <div class="col-lg-7">
      <p class="fw-semibold mb-2">Itens</p>
      <div id="lista-itens"></div>
      <div id="carrinho-vazio" class="text-muted d-none">
        Seu carrinho está vazio. <a href="index.html">Voltar ao cardápio</a>.
      </div>

      <div class="mt-4" id="bloco-pagamento">
        <p class="fw-semibold mb-2">Forma de Pagamento</p>
        <div id="lista-formas" class="d-flex flex-column gap-2"></div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="summary-card">
        <h2 class="h6 mb-3">Resumo Pedido</h2>
        <div class="summary-row"><span>Taxa de entrega</span><span id="res-taxa">R$ 0,00</span></div>
        <div class="summary-row"><span>Subtotal</span><span id="res-subtotal">R$ 0,00</span></div>
        <div class="summary-row total"><span>Total</span><span id="res-total">R$ 0,00</span></div>
        <button class="btn-fitz w-100 mt-3" id="btnFinalizar" disabled onclick="finalizarPedido()">Finalizar</button>
        <p class="small text-muted mt-2 mb-0" id="msgAjuda"></p>
      </div>
    </div>
  </div>
</main>

<div class="bottom-nav-spacer"></div>
<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span>Cardápio</a>
  <a href="carrinho.html" class="active"><span class="icon">🛒</span>Carrinho</a>
  <a href="acompanhamento.html"><span class="icon">📦</span>Acompanhar</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/carrinho-page.js"></script>
</body>
</html>
