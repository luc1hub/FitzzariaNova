<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitzzaria — Bem-vindo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top-bar">
  <div class="container d-flex align-items-center justify-content-between">
    <span style="width: 28px"></span>
    <span class="wordmark">Fitz<em>zaria</em></span>
    <span style="width: 28px"></span>
  </div>
</header>

<main class="container py-4" style="max-width: 480px">
  <img src="img/logo-fitzzaria.jpg" alt="Fitzzaria" class="welcome-photo mb-4">

  <h1 class="h4 text-center mb-1">Bem-vindo à Fitzzaria</h1>
  <p class="text-center text-muted mb-4">Como você quer receber seu pedido?</p>

  <div class="d-flex flex-column gap-3">
    <div class="choice-card" id="cardEntrega" onclick="escolherEntrega()">
      <div class="choice-title">Entrega</div>
    </div>
    <div class="choice-card" id="cardRetirada" onclick="escolherRetirada()">
      <div class="choice-title">Retirada</div>
    </div>
  </div>

  <button class="btn-fitz w-100 mt-4" id="btnContinuar" disabled onclick="continuar()">Continuar</button>
</main>

<script src="js/data.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/boas-vindas.js"></script>
</body>
</html>
