<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitzzaria — Confirmação</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top-bar">
  <div class="container d-flex align-items-center justify-content-between">
    <span style="width: 28px"></span>
    <span class="wordmark">Fitz<em>zaria</em></span>
    <span style="width: 28px"></span>
  </div>
</header>

<main class="container py-4" style="max-width: 480px">
  <div class="summary-card confirmacao-card">
    <p class="text-muted mb-0">Confirmação</p>
    <div class="numero" id="pedido-numero">#000000</div>
    <p class="status-aprovado mb-1" id="pedido-pagamento">Pagamento: APROVADO</p>
    <p class="mb-4">Status: <strong id="pedido-status">CONFIRMADO</strong></p>
    <button class="btn-fitz w-100" id="btnAcompanhar">Acompanhar Pedido</button>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/confirmacao.js"></script>
</body>
</html>
