<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitzzaria — Painel do funcionário</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="container d-flex align-items-center justify-content-between py-3 flex-wrap gap-2">
    <span class="wordmark">Fitz<em>zaria</em></span>
    <span class="status-pill"><span class="dot"></span> Painel do funcionário</span>
  </div>
</header>

<main class="container py-5">
  <div class="d-flex justify-content-between align-items-baseline mb-4 flex-wrap gap-2">
    <div>
      <h1 class="mb-1">Painel de Processamento de Pedidos</h1>
      <p class="text-muted mb-0">Acompanhe e avance o preparo. Atualiza sozinho a cada poucos segundos.</p>
    </div>
    <button class="btn-fitz-outline" onclick="gerarPedidoTeste()">+ gerar pedido de teste</button>
  </div>

  <div class="board" id="board"></div>
</main>

<footer class="site-footer">
  <div class="container">Fitzzaria · Projeto acadêmico — Prática Profissional em ADS, Mackenzie</div>
</footer>

<div class="modal fade" id="previsaoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content fitz">
      <div class="modal-header">
        <h3 class="modal-title h5">Definir previsão de conclusão</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="inputMinutos">Tempo estimado (minutos)</label>
        <input type="number" class="form-control" id="inputMinutos" value="30" min="5" step="5">
      </div>
      <div class="modal-footer">
        <button class="btn-fitz" onclick="confirmarPrevisao()">Aceitar pedido</button>
      </div>
    </div>
  </div>
</div>

<!-- CDN Oficial do Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- CDN Oficial do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Cliente de ligação ao Supabase (Use a mesma URL e KEY do projeto anterior) -->
<script src="js/supabaseClient.js"></script>

<!-- Ficheiros locais da aplicação -->
<script src="js/data.js"></script>
<script src="js/pedidos.js"></script>
<script src="js/funcionario.js"></script>

</body>
</html>
